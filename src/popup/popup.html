<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>YTM Ambient Display</title>
<link rel="stylesheet" href="../ui/fonts.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>

<header>
  <h1>YTM Ambient Display</h1>
  <label class="switch">
    <input type="checkbox" id="enabled">
    <span class="slider"></span>
  </label>
</header>

<section>
  <p class="eyebrow">Side panel</p>
  <div class="segment" role="radiogroup" aria-label="사이드 패널">
    <button type="button" role="radio" data-panel="none" aria-checked="true">없음</button>
    <button type="button" role="radio" data-panel="lyrics" aria-checked="false">가사</button>
    <button type="button" role="radio" data-panel="queue" aria-checked="false">대기열</button>
  </div>
  <p class="note">한 번에 하나만 열립니다.</p>
</section>

<section>
  <p class="eyebrow">Lyrics</p>
  <ul class="rows">
    <li>
      <label for="syncedLyrics">
        <span class="name">싱크 가사 찾기</span>
        <span class="note">제목·아티스트·앨범·길이를 lrclib.net에 보내 줄별 타임스탬프를 받아옵니다. 끄면 YouTube Music 가사만 씁니다</span>
      </label>
      <label class="switch"><input type="checkbox" id="syncedLyrics"><span class="slider"></span></label>
    </li>
    <li>
      <label for="lyricsSeek">
        <span class="name">가사 줄 클릭해서 이동</span>
        <span class="note">싱크 가사에서만 동작합니다</span>
      </label>
      <label class="switch"><input type="checkbox" id="lyricsSeek"><span class="slider"></span></label>
    </li>
  </ul>
  <p class="note">싱크가 어긋나면 전체화면에서 <kbd>[</kbd> <kbd>]</kbd> 로 0.1초씩 맞춥니다.</p>
</section>

<section>
  <p class="eyebrow">Motion</p>
  <ul class="rows">
    <li>
      <label for="gradientMotion">
        <span class="name">화면 움직임</span>
        <span class="note">끄면 색은 그대로, 배경 흐름과 커버 기울임만 멈춥니다</span>
      </label>
      <label class="switch"><input type="checkbox" id="gradientMotion"><span class="slider"></span></label>
    </li>
  </ul>
</section>

<footer id="hint">music.youtube.com 플레이어 바의 전체화면 버튼으로 엽니다.</footer>

<script src="../lib/api.js"></script>
<script src="popup.js"></script>
</body>
</html>
